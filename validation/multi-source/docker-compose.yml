services:
  minio:
    image: docker.io/minio/minio:RELEASE.2025-04-03T14-56-28Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: docker.io/minio/mc:RELEASE.2025-04-01T20-33-51Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb local/mcp-tools --ignore-existing
        mc cp --recursive /data/s3-tools/ local/mcp-tools/tools/
        echo "S3 bucket initialized"
    volumes:
      - ./s3-tools:/data/s3-tools

  mcp-server:
    build:
      context: ../../
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      MCP_SERVER_NAME: multi-source-server
      SOURCE_S3_ENABLED: "true"
      SOURCE_S3_ENDPOINT: http://minio:9000
      SOURCE_S3_BUCKET: mcp-tools
      SOURCE_S3_REGION: us-east-1
      SOURCE_S3_ACCESS_KEY: minioadmin
      SOURCE_S3_SECRET_KEY: minioadmin
    volumes:
      - ./tools:/app/inline/tools
